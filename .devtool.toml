[project]
run_command = "go run ./cmd/bkx --help"
runner = "go"
platform = "cli"

[execution]
environment = "auto"
chroot_name = "androidos"
device_serial = ""

[toolchain]
manager = "auto"

[targets.bkx]
root = "."
execution_environment = "auto"
inputs = [
    ".devtool.toml",
    "go.mod",
    "go.sum",
    "cmd/**",
    "internal/**",
    "pkg/**",
    "scripts/**",
]
outputs = [
    ".devtool/build/go/**",
    ".devtool/package/go/**",
]
runner = "go"
platform = "cli"


[go]
packages = ["./..."]
build_target = "./cmd/bkx"
build_targets = ["./cmd/bkx"]
run_target = "./cmd/bkx"
build_directory = ".devtool/build/go"
package_directory = ".devtool/package/go"
vet = true

# Standalone BKX Android target; embedded/root engine and product UI are validated in-process.
[targets.bkx_android]
root = "android/BKX.Android"
execution_environment = "native-termux"
inputs = [
    ".devtool.toml",
    "android/BKX.Android/**",
]
outputs = [
    "android/BKX.Android/**/build/**",
    "android/BKX.Android/artifacts/**",
]
runner = "android"
platform = "android"

[targets.bkx_android.android]
variant = "embeddedDebug"
platform = "36"
aapt2_provider = "sdk"
instrumentation = "when-device-present"
test_runner = "com.mikeyphw.bkx.android.test/androidx.test.runner.AndroidJUnitRunner"
target_package = "com.mikeyphw.bkx.android"
prefer_native_termux = true

[targets.bkx_android.gradle]
version = "9.7.1"
provider = "auto"

max_workers = 2

structured_events = true

no_daemon = true
daemon_idle_timeout_ms = 900000

parallel = true
build_cache = true
fail_fast = false
offline = false

args = [
  "-Dorg.gradle.parallel=true",
  "-Dorg.gradle.vfs.watch=false",
  "-Pkotlin.incremental=true",
  "-Pkotlin.compiler.execution.strategy=in-process",
  "--warning-mode=all",
]

[targets.bkx_android.tasks]
restore = ["help"]
build = [":app:assemblePersonalDebug"]
test = [":app:bkxBr37BehavioralUnitSeal"]
lint = [":app:lintEmbeddedDebug"]
instrumentation = [":app:connectedEmbeddedDebugAndroidTest"]
release = [":app:bkxPersonalReleaseSeal"]
package = [":app:bkxPersonalPackageAndReleaseLintSeal"]
clean = [":app:clean"]

[targets.bkx_android.artifacts]
output_directory = "artifacts/android"
required = true

[validation.phases]
# BR37: keep Devtool split validation from re-running expensive package,
# lint, unit-test, and Go compatibility lanes during the cheap preflight phase.
# The aggregate tasks below preserve the same release evidence while letting Gradle
# deduplicate dependencies within each phase.
preflight = [
    ":app:bkxBr37StaticPreflightSeal",
]

compile = [
  ":app:compileEmbeddedDebugSources",
]

resources = [
  ":app:processEmbeddedDebugResources",
]

unit-test = [
  ":app:bkxBr37BehavioralUnitSeal",
]

package = [
  ":app:bkxBr37PackageAndReleaseLintSeal",
]

lint = [
  ":app:lintEmbeddedDebug",
]


[validation]
android_safe = false

max_workers = 2
cpu_limit = 2

split_gradle = true
parallel = true

no_daemon = true
stop_daemon_after_phase = false
low_priority = false

gradle_heap_mb = 1152
gradle_metaspace_mb = 768
gradle_packaging_metaspace_mb = 768
gradle_lint_metaspace_mb = 768
memory_guard_mb = 0
affected_module_lint = true


[validation.phase_profiles.preflight]
max_workers = 1
cpu_limit = 1
gradle_heap_mb = 768
memory_guard_mb = 0
no_daemon = true
low_priority = false


[validation.phase_profiles.compile]
max_workers = 2
cpu_limit = 2
gradle_heap_mb = 1152
memory_guard_mb = 0
no_daemon = true
low_priority = false


[validation.phase_profiles.resources]
max_workers = 2
cpu_limit = 2
gradle_heap_mb = 1152
memory_guard_mb = 0
no_daemon = true
low_priority = false


[validation.phase_profiles.unit-test]
max_workers = 2
cpu_limit = 2
gradle_heap_mb = 1152
memory_guard_mb = 0
no_daemon = true
low_priority = false


[validation.phase_profiles.package]
max_workers = 2
cpu_limit = 2
gradle_heap_mb = 1152
gradle_metaspace_mb = 768
memory_guard_mb = 0
no_daemon = true
low_priority = false


[validation.phase_profiles.lint]
max_workers = 1
cpu_limit = 2
gradle_heap_mb = 1152
gradle_metaspace_mb = 768
memory_guard_mb = 0
no_daemon = true
low_priority = false


[validation.phase_profiles.instrumentation]
max_workers = 1
cpu_limit = 1
gradle_heap_mb = 1024
memory_guard_mb = 0
no_daemon = true
low_priority = false


[workspace]
default_target = "bkx"

[workspace.groups]
core = ["bkx"]
android = ["bkx_android"]
all = ["@core", "@android"]

[targets.bkx.jobs.ci-actions-contract]
runner = "command"
command = ["go", "run", "./cmd/devtoolgates", "actions"]
inputs = [".devtool.toml", ".github/workflows/*.yml", "cmd/devtoolgates/**"]
metadata = { read_only = true }

[targets.bkx.jobs.r1-source-contract]
runner = "command"
command = ["go", "run", "./cmd/devtoolgates", "r1"]
inputs = ["cmd/devtoolgates/**", "android/BKX.Android/app/src/main/java/com/mikeyphw/bkx/android/r1/**", "android/BKX.Android/app/src/main/java/com/mikeyphw/bkx/android/feature/more/RcloneRemotesScreen.kt", "android/BKX.Android/app/src/androidTest/java/com/mikeyphw/bkx/android/r1/**"]
metadata = { read_only = true }

[targets.bkx.jobs.api03-skybind-consumer]
runner = "command"
command = ["bash", "scripts/api03-source-check.sh"]
inputs = ["internal/rcloneops/**", "scripts/api03-source-check.sh", "docs/r1/SKYBIND_API03_ROOT_RCLONE_CONSUMER_20261026.md"]
metadata = { read_only = true }

[targets.bkx.workflows]
ci-preflight = [
  { id = "actions-contract", ref = "job:ci-actions-contract", depends_on = [] },
  { id = "r1-source", ref = "job:r1-source-contract", depends_on = [] },
  { id = "api03", ref = "job:api03-skybind-consumer", depends_on = [] },
]
ci-local = [
  { id = "actions-contract", ref = "job:ci-actions-contract", depends_on = [] },
  { id = "r1-source", ref = "job:r1-source-contract", depends_on = [] },
  { id = "api03", ref = "job:api03-skybind-consumer", depends_on = [] },
  { id = "go-unit", ref = "runner:go#test", depends_on = ["actions-contract", "r1-source", "api03"] },
  { id = "android-contracts", ref = "target:bkx_android#test", depends_on = ["actions-contract", "r1-source", "api03"] },
]


[workspace.scheduler]
parallel = true
max_parallel_nodes = 2
max_gradle_nodes = 1
max_dotnet_nodes = 1

[wrapper]
schema = 2
default_command = "build"

[wrapper.commands.build]
description = "build through canonical Devtool and EXO"
devtool = "build"
target = "bkx"
allow_passthrough = true

[wrapper.commands.test]
description = "test through canonical Devtool and EXO"
devtool = "test"
target = "bkx"
allow_passthrough = true

[wrapper.commands.android-build]
description = "android-build through canonical Devtool and EXO"
devtool = "build"
target = "bkx_android"
allow_passthrough = true

[wrapper.commands.android-test]
description = "android-test through canonical Devtool and EXO"
devtool = "test"
target = "bkx_android"
allow_passthrough = true

[wrapper.commands.android-validate]
description = "android-validate through canonical Devtool and EXO"
devtool = "validate"
target = "bkx_android"
allow_passthrough = true

[wrapper.commands.ci-preflight]
description = "ci-preflight through canonical Devtool and EXO"
workflow = "ci-preflight"
target = "bkx"

[wrapper.commands.ci-local]
description = "ci-local through canonical Devtool and EXO"
workflow = "ci-local"
target = "bkx"
