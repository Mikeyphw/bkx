[project]
kind = "python"
python = "python3"
run_command = "bkx --help"

[execution]
environment = "auto"
chroot_name = "androidos"
device_serial = ""

[toolchain]
manager = "auto"

[targets.bkx]
type = "python"
root = "."

[python]
manager = ""
test_framework = "pytest"
groups = []
extras = ["dev", "tui"]
validator_dependencies = [
  "build",
  "-r",
  "scripts/validator-local-deps.txt",
  "pytest>=8",
  "pytest-cov>=4",
  "typer>=0.12",
  "rich>=14.2.0",
  "textual>=7.1",
  "hypothesis>=6",
  "PyYAML>=6",
  "jsonschema>=4.23",
  "ruff",
  "pyright"
]
locked = false
offline = false
install_project = true
isolation = true
source_import_isolation = false
cli_contract = true
disable_network = false
fresh_dist = true
clean_categories = ["artifacts", "caches"]
lint = ["ruff"]

[python.package]
verify_all_wheels = false
rebuild_sdist = false
import_smoke = true
verify_cli = true
install_dependencies = false
import_modules = ["bkx"]
console_scripts = ["bkx"]

# Android companion app target created by BKX Android AOV-01/AOV-02.
[targets.bkx_android]
type = "android"
root = "android/BKX.Android"

[targets.bkx_android.android]
variant = "debug"
platform = "37"
aapt2_provider = "auto"
instrumentation = "when-device-present"

[targets.bkx_android.gradle]
version = "9.5.0"
max_workers = 1
structured_events = true
parallel = false
build_cache = true
daemon_idle_timeout_ms = 900000
args = ["-Pandroid.suppressUnsupportedOptionWarnings=android.aapt2FromMavenOverride,android.suppressUnsupportedOptionWarnings"]

[targets.bkx_android.tasks]
restore = ["help"]
build = [":app:assembleDebug"]
test = [":app:testDebugUnitTest"]
lint = [":app:lintDebug"]
clean = [":app:clean"]

[targets.bkx_android.artifacts]
output_directory = "artifacts/android"
required = true
