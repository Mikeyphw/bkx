[project]
kind = "go"
run_command = "go run ./cmd/bkx --help"

[execution]
environment = "auto"
chroot_name = "androidos"
device_serial = ""

[toolchain]
manager = "auto"

[targets.bkx]
type = "go"
root = "."
execution_environment = "auto"


[go]
packages = ["./..."]
build_target = "./cmd/bkx"
build_targets = ["./cmd/bkx"]
run_target = "./cmd/bkx"
build_directory = ".devtool/build/go"
package_directory = ".devtool/package/go"
vet = true

# Standalone BKX Android target; embedded/root engine and product UI are validated in-process.
[targets.bkx_android]
type = "android"
root = "android/BKX.Android"
execution_environment = "native-termux"

[targets.bkx_android.android]
variant = "debug"
platform = "36"
aapt2_provider = "sdk"
instrumentation = "when-device-present"
test_runner = "com.mikeyphw.bkx.android.test/androidx.test.runner.AndroidJUnitRunner"
target_package = "com.mikeyphw.bkx.android"
prefer_native_termux = true

[targets.bkx_android.gradle]
version = "9.7.1"
provider = "auto"

max_workers = 2

structured_events = false

no_daemon = true
daemon_idle_timeout_ms = 900000

parallel = true
build_cache = true
fail_fast = false
offline = false

args = [
  "-Dorg.gradle.parallel=true",
  "-Dorg.gradle.vfs.watch=false",
  "-Pkotlin.incremental=true",
  "-Pkotlin.compiler.execution.strategy=in-process",
  "--warning-mode=all",
]

[targets.bkx_android.tasks]
restore = ["help"]
build = [":app:assembleDebug"]
test = [":app:testDebugUnitTest"]
lint = [":app:lintDebug"]
instrumentation = [":app:connectedDebugAndroidTest"]
release = [":app:bkxAndroidReleaseSeal"]
package = [":app:assembleRelease"]
clean = [":app:clean"]

[targets.bkx_android.artifacts]
output_directory = "artifacts/android"
required = true

[validation.phases]
preflight = [
    ":app:verifyBkxAndroidSdk36DependencyLane",
    ":app:verifyBkxEmbeddedEngineContract",
    ":app:verifyBkxRootStorageContract",
    ":app:verifyBkxProductUiContract",
    ":app:verifyBkxRcloneRemoteTransportContract",
    ":app:verifyBkx16KbNativePageSizeContract",
    ":app:verifyBkxGoogleDriveProductContract",
    ":app:verifyBkxAutomationProductContract",
    ":app:verifyBkxCloudProductReleaseSeal",
    ":app:verifyBkxRuntimeHardeningContract",
    ":app:verifyBkxRestoreSafetySeal",
    ":app:verifyBkxPerformanceAndProgressContract",
    ":app:verifyBkxLargeTreePerformanceSeal",
    ":app:verifyBkxStorageCompletenessContract",
    ":app:verifyBkxAccessibilityVisualContract",
    ":app:verifyBkxUxHardeningContract",
    ":app:verifyBkxEmbeddedParitySeal",
    ":app:verifyBkxReleaseHygiene",
    ":app:verifyBkxDeviceQualificationContract",
    ":app:verifyBkxGoProductionCutoverContract",
    ":app:verifyBkxGoOnlyAndroidRuntimeContract",
    ":app:verifyBkxFinalReleaseContract",
    ":app:verifyBkxAndroidManifestReleaseContract",
    ":app:verifyBkxAndroidSigningPlaceholders",
    ":app:verifyBkxPersonalSigningContract",
    ":app:verifyBkxAndroidReleaseDocs",
    ":app:verifyBkxBackupAutomationRoadmapFinalSeal",
    ":app:verifyBkxRuntimeLifetimeForegroundCancellationSeal",
]

compile = [
  ":app:compileDebugSources",
]

resources = [
  ":app:processDebugResources",
]

unit-test = [
  ":app:testDebugUnitTest",
]

package = [
  ":app:assembleDebug",
  ":app:assembleDebugAndroidTest",
  ":app:assembleRelease",
]

lint = [
  ":app:lintDebug",
]


[validation]
android_safe = false

max_workers = 2
cpu_limit = 2

split_gradle = true
parallel = true

no_daemon = true
stop_daemon_after_phase = false
low_priority = false

gradle_heap_mb = 1152
gradle_metaspace_mb = 768
gradle_packaging_metaspace_mb = 768
gradle_lint_metaspace_mb = 768
memory_guard_mb = 0
affected_module_lint = true


[validation.phase_profiles.preflight]
max_workers = 1
cpu_limit = 1
gradle_heap_mb = 768
memory_guard_mb = 0
no_daemon = true
low_priority = false


[validation.phase_profiles.compile]
max_workers = 2
cpu_limit = 2
gradle_heap_mb = 1152
memory_guard_mb = 0
no_daemon = true
low_priority = false


[validation.phase_profiles.resources]
max_workers = 2
cpu_limit = 2
gradle_heap_mb = 1152
memory_guard_mb = 0
no_daemon = true
low_priority = false


[validation.phase_profiles.unit-test]
max_workers = 2
cpu_limit = 2
gradle_heap_mb = 1152
memory_guard_mb = 0
no_daemon = true
low_priority = false


[validation.phase_profiles.package]
max_workers = 2
cpu_limit = 2
gradle_heap_mb = 1152
gradle_metaspace_mb = 768
memory_guard_mb = 0
no_daemon = true
low_priority = false


[validation.phase_profiles.lint]
max_workers = 1
cpu_limit = 2
gradle_heap_mb = 1152
gradle_metaspace_mb = 768
memory_guard_mb = 0
no_daemon = true
low_priority = false


[validation.phase_profiles.instrumentation]
max_workers = 1
cpu_limit = 1
gradle_heap_mb = 1024
memory_guard_mb = 0
no_daemon = true
low_priority = false


# Devtool overlay commit metadata. Keep this in overlay artifacts so apply creates the commit.
[commit]
enabled = true
strategy = "single"
message = "fix(android): seal BKX storage filesystem root safety"
