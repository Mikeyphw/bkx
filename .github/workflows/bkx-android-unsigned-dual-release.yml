# RM-16/ACTIONS-10: ONE source-bound unsigned GitHub build, TWO isolated candidate artifacts.
# GitHub never sees the personal BKX LIFE signing identity. No release or device qualification is claimed.
name: BKX Android - Unsigned Embedded and Lite
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bkx-dual-unsigned-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  unsigned-dual:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BKX_UNSIGNED_CI_RELEASE: '1'
      BKX_RCLONE_REQUIRE_LOCK: '1'
      BKX_RCLONE_SOURCE_LOCK: ${{ github.workspace }}/config/bclone-android-source.lock
      BKX_BUILD_COMMIT: ${{ github.sha }}
      BKX_RCLONE_BUILD_JOBS: '2'
      # Explicitly keep Gradle outside any developer-local personal signing config.
      BKX_ANDROID_SIGNING_PROPERTIES: ${{ github.workspace }}/.bkx-signing-disabled-do-not-create.properties
    steps:
      - name: Checkout immutable run source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify source and the reviewed bclone lock
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ -z "$(git status --porcelain --untracked-files=no)" ]]
          [[ ! -e "$BKX_ANDROID_SIGNING_PROPERTIES" ]]
          python3 scripts/verify-bclone-source-lock.py config/bclone-android-source.lock
          python3 scripts/verify-bkx-rel03-gates.py
          python3 scripts/verify-android-editions.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
          cache: true
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools ndk;29.0.14206865'
          log-accepted-android-sdk-licenses: 'false'
      - name: Verify exact hosted compiler and Android SDK
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(go env GOVERSION)" == 'go1.27.2' ]]
          [[ "$(sed -n 's/^[[:space:]]*Pkg.Revision[[:space:]]*=[[:space:]]*//p' "$ANDROID_HOME/ndk/29.0.14206865/source.properties" | head -1)" == '29.0.14206865' ]]
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          for tool in aapt apksigner zipalign; do
            test -x "$ANDROID_HOME/build-tools/36.0.0/$tool"
          done
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Compile Embedded and Lite together, never signing either
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$BKX_ANDROID_SIGNING_PROPERTIES"
          # One Gradle invocation reuses the BKX Go producer for both editions.
          gradle -p android/BKX.Android --no-daemon --stacktrace \
            :app:assembleEmbeddedRelease :app:assembleLiteRelease \
            :app:verifyBkxEditionApkContents \
            :app:verifyBkxEmbeddedRelease16Kb :app:verifyBkxLiteRelease16Kb
      - name: Produce strict ACTIONS-10 candidate manifests and unsigned APK roots
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/produce-bkx-unsigned-candidates.py \
            --apk-root android/BKX.Android/app/build/outputs/apk \
            --output "$RUNNER_TEMP/bkx-unsigned-candidates"
          for edition in bkx-embedded bkx-lite; do
            test "$(find "$RUNNER_TEMP/bkx-unsigned-candidates/$edition" -maxdepth 1 -type f | wc -l)" -eq 2
          done
      - name: Upload exact unsigned Embedded APK and manifest
        uses: actions/upload-artifact@v4
        with:
          name: bkx-android-embedded-unsigned-release
          path: ${{ runner.temp }}/bkx-unsigned-candidates/bkx-embedded/
          if-no-files-found: error
          retention-days: 14
      - name: Upload exact unsigned Lite APK and manifest
        uses: actions/upload-artifact@v4
        with:
          name: bkx-android-lite-unsigned-release
          path: ${{ runner.temp }}/bkx-unsigned-candidates/bkx-lite/
          if-no-files-found: error
          retention-days: 14
