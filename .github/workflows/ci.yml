name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install base and test tooling
        run: |
          python -m pip install -U pip
          python -m pip install -e '.[dev]'
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Typecheck
        run: pyright
      - name: GO00 contract drift
        run: PYTHONPATH=src python tools/go_migration/export_contracts.py --check
      - name: Base tests
        run: >-
          pytest -q tests
          --ignore=tests/tui
          --ignore=tests/interactive
          --ignore=tests/contracts/test_optional_interface_parity_contract.py
      - name: Wheel smoke
        shell: bash
        run: |
          python -m build --wheel
          WHEEL="$(ls dist/*.whl | head -n 1)"
          python -m venv /tmp/bkx-wheel-smoke
          /tmp/bkx-wheel-smoke/bin/python -m pip install -U pip
          /tmp/bkx-wheel-smoke/bin/python -m pip install "$WHEEL"
          /tmp/bkx-wheel-smoke/bin/python -m bkx --help
          /tmp/bkx-wheel-smoke/bin/bkx --help
          /tmp/bkx-wheel-smoke/bin/python - <<'PY2'
          from importlib.resources import files
          schema = files('bkx.core.schemas').joinpath('backup_spec.json')
          css_files = [p for p in files('bkx.tui').joinpath('css').rglob('*.tcss') if p.is_file()]
          assert schema.is_file(), schema
          assert len(css_files) >= 21, len(css_files)
          print('base-package-assets-ok')
          PY2
  go-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: GO00-GO06 migration parity gate
        run: ./scripts/validate-go06.sh
