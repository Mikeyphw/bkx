name: CI

on:
  push:
  pull_request:

jobs:
  python-reference:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python reference and test tooling
        run: |
          python -m pip install -U pip
          python -m pip install -e '.[reference,dev]'
      - name: Lint Python reference
        run: |
          ruff check .
          ruff format --check .
      - name: Typecheck Python reference
        run: pyright
      - name: GO00 contract drift against Python reference
        run: PYTHONPATH=src python tools/go_migration/export_contracts.py --check
      - name: Python reference tests
        run: >-
          pytest -q tests
          --ignore=tests/tui
          --ignore=tests/interactive
          --ignore=tests/contracts/test_optional_interface_parity_contract.py
      - name: Python reference wheel smoke
        shell: bash
        run: |
          python -m build --wheel
          WHEEL="$(ls dist/*.whl | head -n 1)"
          python -m venv /tmp/bkx-wheel-smoke
          /tmp/bkx-wheel-smoke/bin/python -m pip install -U pip
          WHEEL_ABS="$(python -c 'import os,sys; print(os.path.abspath(sys.argv[1]))' "$WHEEL")"
          /tmp/bkx-wheel-smoke/bin/python -m pip install "bkx[reference] @ file://$WHEEL_ABS"
          /tmp/bkx-wheel-smoke/bin/python -m bkx --help
          test ! -e /tmp/bkx-wheel-smoke/bin/bkx # assert-reference-has-no-console-script
          /tmp/bkx-wheel-smoke/bin/python - <<'PY2'
          from importlib.resources import files
          schema = files('bkx.core.schemas').joinpath('backup_spec.json')
          css_files = [p for p in files('bkx.tui').joinpath('css').rglob('*.tcss') if p.is_file()]
          assert schema.is_file(), schema
          assert len(css_files) >= 21, len(css_files)
          print('python-reference-package-assets-ok')
          PY2

  go-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Install parity/reference dependencies
        run: python -m pip install -e '.[reference,dev]'
      - name: GO00-GO16 production Go release gate
        run: ./scripts/validate-go16.sh
