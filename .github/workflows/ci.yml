name: CI

on:
  push:
  pull_request:

jobs:
  go-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Native Devtool and R1 source contracts (not device qualification)
        run: |
          go run ./cmd/devtoolgates actions
          go run ./cmd/devtoolgates r1
      - name: BKX Go/Kotlin maintenance seal
        run: bash ./scripts/validate.sh

  android-release-packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools ndk;29.0.14206865'
          log-accepted-android-sdk-licenses: 'false'
      - name: Verify Android SDK and NDK installation
        run: |
          set -euo pipefail
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -f "$ANDROID_HOME/ndk/29.0.14206865/source.properties"
          test -x "$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
      - name: BKX Android release packaging contract
        run: |
          gradle -p android/BKX.Android \
            :app:verifyBkxReleasePackagingSigningNativeRuntimeSeal \
            :app:testEmbeddedDebugUnitTest :app:testLiteDebugUnitTest \
            :app:lintEmbeddedDebug :app:lintLiteDebug \
            :app:lintEmbeddedRelease :app:lintLiteRelease \
            --no-daemon --stacktrace

      # Preserve lint diagnostics on failure; normal lintEmbeddedDebug/lintEmbeddedRelease/lintLiteRelease remain strict gates.
      - name: Print full Android Lint error reports
        if: ${{ always() }}
        shell: bash
        run: |
          for report in android/BKX.Android/app/build/reports/lint-results-embeddedDebug.xml android/BKX.Android/app/build/reports/lint-results-embeddedRelease.xml android/BKX.Android/app/build/reports/lint-results-liteRelease.xml android/BKX.Android/app/build/reports/lint-results-embeddedDebug.txt android/BKX.Android/app/build/reports/lint-results-embeddedRelease.txt android/BKX.Android/app/build/reports/lint-results-liteRelease.txt; do
            if [[ -f "$report" ]]; then
              echo "=== ANDROID_LINT_REPORT: $report ==="
              cat "$report"
            fi
          done
      - name: Retain full Android Lint reports on failed CI
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: bkx-android-ci-lint-reports
          if-no-files-found: ignore
          retention-days: 14
          path: |
            android/BKX.Android/app/build/reports/lint-results-embeddedDebug.*
            android/BKX.Android/app/build/reports/lint-results-embeddedRelease.*
            android/BKX.Android/app/build/reports/lint-results-liteRelease.*

      # Retain all JVM test failures, not only Gradle's summarized first assertion.
      - name: Retain Android JVM test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: bkx-android-ci-unit-test-reports
          if-no-files-found: ignore
          retention-days: 14
          path: |
            android/BKX.Android/app/build/test-results/testEmbeddedDebugUnitTest/**/*.xml
            android/BKX.Android/app/build/reports/tests/testEmbeddedDebugUnitTest/**
            android/BKX.Android/app/build/test-results/testLiteDebugUnitTest/**/*.xml
            android/BKX.Android/app/build/reports/tests/testLiteDebugUnitTest/**
