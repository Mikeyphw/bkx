name: CI

on:
  push:
  pull_request:

jobs:
  go-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: GO18 Go-only repository, compatibility, and release seal
        run: ./scripts/validate-go18.sh
