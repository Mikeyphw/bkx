name: CI

on:
  push:
  pull_request:

jobs:
  go-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: BKX Go/Kotlin maintenance seal
        run: bash ./scripts/validate.sh

  android-release-packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK lane
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"
      - name: BKX Android release packaging contract
        run: |
          gradle -p android/BKX.Android             :app:verifyBkxReleasePackagingSigningNativeRuntimeSeal             :app:testDebugUnitTest             :app:lintDebug             :app:lintRelease             --no-daemon --stacktrace
