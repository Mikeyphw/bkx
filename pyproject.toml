[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bkx"
version = "1.0.0"
description = "Contract-controlled backup, archive, restore, and transfer tool"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
reference = [
    "typer>=0.12",
    "rich>=14.2.0",
    "PyYAML>=6",
    "jsonschema>=4.23",
]
interactive = [
    "mikomn[cli]",
]
tui = [
    "textual>=7.1",
    "mikomn[tui]",
]
dev = [
    "build",
    "hypothesis>=6",
    "pytest>=8",
    "pytest-cov>=4",
    "jsonschema>=4.23",
    "ruff",
    "pyright",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"bkx.core.schemas" = ["*.json"]
"bkx.tui" = ["css/**/*.tcss", "css/*.tcss"]
"bkx.tui.css" = ["*.tcss", "**/*.tcss"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
