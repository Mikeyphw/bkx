[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "bkx"
version = "0.0.1"
description = "Contract-controlled CLI-first backup/archive tool (skeleton)"
readme = "README.md"
license = "MIT"
authors = ["You <you@example.com>"]

[tool.poetry.dependencies]
python = ">=3.11"
typer = ">=0.12"
rich = ">=14.2.0"

[tool.poetry.extras]
interactive = [
    "mikomn",
]
tui = [
    "mikomn",
    "textual",
]
dev = [
    "ruff",
    "pyright",
    "pytest",
    "pytest-cov",
]

[tool.poetry.scripts]
bkx = "bkx.cli.app:main"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

