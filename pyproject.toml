[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bkx"
version = "0.0.1"
description = "Contract-controlled CLI-first backup/archive tool (skeleton)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "You", email = "you@example.com" }]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=14.2.0",
    "PyYAML>=6",
    "jsonschema>=4.23",
]

[project.optional-dependencies]
interactive = [
    "mikomn[cli]",
]
tui = [
    "textual>=7.1",
    "mikomn[tui]",
]
dev = [
    "ruff",
    "pyright",
]

[project.scripts]
bkx = "bkx.cli.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"bkx.core.schemas" = ["*.json"]
"bkx.tui.css" = ["*.tcss", "**/*.tcss"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
