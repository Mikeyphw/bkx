[project]
name = "bkx"
version = "0.0.0"
description = "Contract-controlled CLI-first backup/archive tool (skeleton)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "You", email = "you@example.com"}]
dependencies = [
  "typer>=0.12",
  "rich>=13.0.0",
]

[project.optional-dependencies]
interactive = [
  "mikomn[cli]>=0.3.0",
]
tui = [
  "mikomn[tui]>=0.3.0",
  "textual>=0.50.0",
]
dev = [
  "ruff>=0.5.0",
  "pyright>=1.1.0",
  "pytest>=8.0.0",
  "pytest-cov>=4.0.0",
]

[project.scripts]
bkx = "bkx.cli.app:main"

[build-backend]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

